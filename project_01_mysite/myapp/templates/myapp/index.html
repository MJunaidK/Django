{% extends "myapp/base.html" %} {% block body %}
<div>
  {% for item in item_list %}
  <div class="m-10 flex w-1/2 mx-auto">
    <div>
      <img class="w-64 rounded-lg" src="{{item.item_image}}" />
    </div>
    <div class="mx-16">
      <div class="font-bold">{{ item.item_name }}</div>
      <div>{{ item.item_desc }}</div>
      <div class="font-bold mt-2 text-blue-600">${{ item.item_price }}</div>
    </div>
    <div class="mt-4">
      <a
        href="{% url 'myapp:detail' item.id %}"
        class="bg-red-500 text-white font-bold px-4 py-2 rounded-md"
        >View Details</a
      >
    </div>
    </div>
    {% endfor %}
  </div>
  {% endblock %}
</div>
