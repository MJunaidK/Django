{% extends "myapp/base.html" %}
<!-- Login template -->
{% block body %}
<div class="flex flex-col items-center justify-center min-h-screen p-10">
  <h1>Login</h1>
  <form method="post" class="shadow-lg p-10 space-y-6 rounded-lg bg-white w-96">
    {% csrf_token %}
    <div>
      {% if form.non_field_errors %}
      <div class="text-red-500 mb-4">
        {% for error in form.non_field_errors %}
          <p>{{ error }}</p>
        {% endfor %}
      </div>
      {% endif %}  
       
      <div class="text-red-500 mb-4">
        {{ form.non_field_errors }}
      <label for="id_username">Username:</label>
      <div class="border rounded p-2">{{ form.username }}</div>
    </div>
    <div>
      <label for="id_password">Password:</label>
      <div class="border rounded p-2">{{ form.password }}</div> 
    <button type="submit" class="bg-blue-500 px-2 py-2 w-full text-white">Login</button>
  </form>
</div>
{% endblock %}
